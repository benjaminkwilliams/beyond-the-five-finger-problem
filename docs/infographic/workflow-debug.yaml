    label_position:
      x: 1045
      y: 1230
  - id: dl_seq
    from:
      box: checker_dl
      side: right
      offset: 0.5
    to:
      box: checker_seq
      side: left
      offset: 0.5
    points:
    - - 2060
      - 1270
    - - 2100
      - 1270
    line_style: flow
    arrows: end
