    - - 2620
      - 1070
    - - 2620
      - 1100
    - - 550
      - 1100
    - - 550
      - 1130
    line_style: flow
    arrows: end
    label: assignments
    label_position:
      x: 1500
      y: 1100
  - id: sidecar_dl
    from:
      box: sidecar
      side: right
      offset: 0.5
    to:
      box: checker_dl
      side: left
      offset: 0.5
