  legend:
    x: 80
    y: 2240
    entries:
    - line_style: flow
      label: "Data flow \u2014 what calls what, in order"
    - line_style: fail
      label: "Fail path \u2014 checker FAIL to amender"
    - line_style: spec
      label: "Spec \u2014 shared state, regression rule only"
  footer:
    x: 80
    y: 2840
    brand: "Beyond the Five Finger Problem \u2014 debug map, 2026-10-27"
    note: 'Technical version: function names, endpoints, and file paths on each card. Gaps box is part of the map, not a footnote.'
