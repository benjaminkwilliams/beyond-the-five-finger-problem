infographic:
  template_version: '1.1'
  theme: dark
  title: "BEYOND THE FIVE FINGER PROBLEM \u2014 DEBUG MAP"
  subtitle: 'What calls what, current state 2026-10-27: M1 closed, M2 closed, M3 graph + Meta Image generator, M4 packaging'
  canvas:
    width: 3200
    height: 2940
    safe_margin: 60
  layout:
    mode: absolute
    connectors: true
    routing: orthogonal
  typography: ecosystem
  icons:
    enabled: false
  title_position:
    x: 80
    y: 55
  subtitle_position:
    x: 80
    y: 125
  boxes:
  - id: spec
    role: information
    style: card
    accent: neutral
    title: "SPEC \u2014 shared state, every node reads it"
    body_lines:
    - "glossary (M1 frozen) \u2022 skeleton_kick_full.json"
    - "calibration weights \u2022 bench 7 + holdout 3"
    x: 60
    y: 210
    width: 3080
    height: 200
  - id: gen_media
    role: information
    style: card
    accent: blue
    title: "GENERATOR A \u2014 Muse media pipeline"
    body_lines:
    - media.generate_image()
    - subagent expands prompt
    - 'input: sidecar PNG + text'
    - 'output: webp drawing'
    - expansion unseen, no API call
    x: 60
    y: 430
    width: 980
    height: 300
  - id: gen_meta
    role: information
    style: card
    accent: blue
    title: "GENERATOR B \u2014 Meta Image API (new)"
    body_lines:
    - meta_image.py, graph.generator()
    - POST /v1/images/generations
    - POST /v1/images/edits (sidecar)
    - model muse-image-1.0, b64 webp
    x: 1080
    y: 430
    width: 980
    height: 300
  - id: skeleton
    role: information
    style: card
    accent: teal
    title: "SKELETON \u2014 source of truth, not a prompt"
    body_lines:
    - skeleton.py, 25 markers
    - ik.py two-bone IK knees
    - render_skeleton.py sidecars
    - red = Starboard, blue = Port
    x: 2100
    y: 430
    width: 1040
    height: 300
  - id: frames
    role: information
    style: card
    accent: blue
    title: "FRAMES \u2014 adjacent pair is the unit"
    body_lines:
    - Frame A, frame B
    - adjacent pair is the unit
    - guard = anchor, not judged
    - return = anchor-end, not judged
    x: 60
    y: 790
    width: 980
    height: 280
  - id: sam
    role: information
    style: card
    accent: purple
    title: "PROPOSER 1 \u2014 SAM 3.1 masks"
    body_lines:
    - run_extraction.sam_fg()
    - POST /v1/responses, sam-3.1
    - meta-sam-parser decode
    - leg/shoe/face/fist masks
    x: 1080
    y: 790
    width: 980
    height: 280
  - id: spark
    role: information
    style: card
    accent: purple
    title: "PROPOSER 2 \u2014 Spark 1.3 roles + facing"
    body_lines:
    - run_extraction.spark()
    - POST /v1/chat/completions
    - dot-first prompt v1.2
    - roles by foot dot, not screen
    x: 2100
    y: 790
    width: 1040
    height: 280
  - id: sidecar
    role: information
    style: card
    accent: purple
    title: "SIDECAR \u2014 separate black canvas"
    body_lines:
    - extraction.render_sidecar()
    - dots + polygon, black canvas
    - cyan ring = toward camera
    - white ring = away, zero = unknown
    x: 60
    y: 1130
    width: 980
    height: 280
  - id: checker_dl
    role: information
    style: card
    accent: green
    title: "CHECKER \u2014 DL + boundary budget"
    body_lines:
    - calibration.dl_for_pair()
    - role 3.0, facing 3.0
    - appear 1.0, change 3.0
    - within 2.00, boundary 4.00
    x: 1080
    y: 1130
    width: 980
    height: 280
  - id: checker_seq
    role: information
    style: card
    accent: green
    title: "CHECKER \u2014 sequence + proportions"
    body_lines:
    - sequence_judge.judge_sequence()
    - kick leg constant, no smearing
    - 'proportions: hip-knee-foot'
    - limb limit x1.10 + 10px
    x: 2100
    y: 1130
    width: 1040
    height: 280
  - id: facing
    role: information
    style: card
    accent: green
    title: "CHECKER \u2014 facing as vector"
    body_lines:
    - facing.py, Head + Torso vectors
    - angle, threshold 30 deg
    - ring vs vector = change
    - unknown is not a change
    x: 60
    y: 1470
    width: 980
    height: 280
  - id: amender
    role: information
    style: card
    accent: amber
    title: "AMENDER \u2014 repair, never re-roll"
    body_lines:
    - graph.amender()
    - named-set instruction
    - regenerate failing frame only
    - do not mirror a frame
    x: 1080
    y: 1470
    width: 980
    height: 280
  - id: bench
    role: information
    style: card
    accent: red
    title: "BENCH-JUDGE \u2014 verdict vs ground truth"
    body_lines:
    - graph.bench_judge()
    - SadPocky swap FAIL, rest PASS
    - Sensei 2->3 FAIL, 4->5 FAIL
    - passing a fail case is wrong
    x: 2100
    y: 1470
    width: 1040
    height: 280
  - id: report
    role: information
    style: card
    accent: green
    title: "REPORT + DEMO \u2014 M3 output"
    body_lines:
    - demo_m3.py, no new API calls
    - runs/results/report_m3.md
    - 'lead demo: leg swap, frames fine'
    - 'graph.py: five nodes, spec shared'
    x: 60
    y: 1810
    width: 980
    height: 280
  - id: observ
    role: information
    style: card
    accent: teal
    title: "OBSERVABILITY \u2014 heartbeat + telemetry"
    body_lines:
    - heartbeat.py, 90s + step change
    - runs/current/heartbeat.json
    - telemetry.py -> telemetry.jsonl
    - 'masks run: 48.6s, 3.3-6.0s/frame'
    x: 1080
    y: 1810
    width: 980
    height: 280
  - id: gaps
    role: information
    style: card
    accent: red
    title: "KNOWN GAPS \u2014 debug here first"
    body_lines:
    - 'Unmarked drawings: no side assign'
    - sidecar = loose, not a lock
    - 'shoe prompt: 0 masks mostly'
    - edit rate 20/s uncalibrated
    x: 2100
    y: 1810
    width: 1040
    height: 280
  line_styles:
    flow:
      accent: neutral
      pattern: solid
      width: 5
    fail:
      accent: red
      pattern: solid
      width: 5
    spec:
      accent: red
      pattern: dashed
      width: 5
      dash:
      - 14
      - 11
  relationships:
  - id: skeleton_genmeta
    from:
      box: skeleton
      side: left
      offset: 0.5
    to:
      box: gen_meta
      side: right
      offset: 0.5
    points:
    - - 2100
      - 580
    - - 2060
      - 580
    line_style: flow
    arrows: end
    label: sidecar in
    label_position:
      x: 2060
      y: 540
  - id: genmeta_frames
